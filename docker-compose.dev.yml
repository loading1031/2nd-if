services:
  django:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8000:8000"
    env_file:
      - server/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_ALLOW_ASYNC_UNSAFE: "true"
    volumes:
      - ./server:/app/server
      - media_data:/app/server/media
    command:
      - uv
      - run
      - --frozen
      - uvicorn
      - config.asgi:application
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/server
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: secondif
      POSTGRES_USER: secondif
      POSTGRES_PASSWORD: secondif2024
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: pg_isready -U secondif
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  media_data:
