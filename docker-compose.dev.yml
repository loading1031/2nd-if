include:
  - path: ../dify/docker/docker-compose.yaml
    env_file: ../dify/docker/.env

services:
  django:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8000:8000"
    env_file:
      - server/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_ALLOW_ASYNC_UNSAFE: "true"
    volumes:
      - ./server:/app/server
      - media_data:/app/server/media
    command: ["uv", "run", "python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/secondif2024
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  media_data:
