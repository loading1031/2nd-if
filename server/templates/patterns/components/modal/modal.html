<div class="space-y-4">
    <div>
        <p class="text-sm text-gray-500 mb-2 font-mono">Modal (click to open)</p>
        <button class="btn btn-primary" onclick="pattern_modal.showModal()">Open Modal</button>

        <dialog id="pattern_modal" class="modal">
            <div class="modal-box">
                <h3 class="font-bold text-lg">Modal Title</h3>
                <p class="py-4">This is a modal dialog. You can put any content here.</p>
                <div class="modal-action">
                    <form method="dialog">
                        <button class="btn">Close</button>
                    </form>
                </div>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>
    </div>

    <div>
        <p class="text-sm text-gray-500 mb-2 font-mono">Modal with Form</p>
        <button class="btn btn-secondary" onclick="pattern_form_modal.showModal()">Open Form Modal</button>

        <dialog id="pattern_form_modal" class="modal">
            <div class="modal-box">
                <h3 class="font-bold text-lg">Create Item</h3>
                <form class="space-y-4 mt-4">
                    <label class="form-control w-full">
                        <div class="label">
                            <span class="label-text">Title</span>
                        </div>
                        <input type="text" class="input input-bordered w-full" placeholder="Enter title" />
                    </label>
                    <label class="form-control w-full">
                        <div class="label">
                            <span class="label-text">Description</span>
                        </div>
                        <textarea class="textarea textarea-bordered w-full" placeholder="Enter description"></textarea>
                    </label>
                </form>
                <div class="modal-action">
                    <form method="dialog">
                        <button class="btn btn-ghost">Cancel</button>
                    </form>
                    <button class="btn btn-primary">Create</button>
                </div>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>
    </div>
</div>
