{% for variant in variants %}
<div class="mb-6">
    <p class="text-sm text-gray-500 mb-2 font-mono">{{ variant.label }}</p>
    <div class="flex flex-wrap gap-2">
        <button class="btn {{ variant.class }}">{{ variant.text }}</button>
        <button class="btn {{ variant.class }} btn-sm">Small</button>
        <button class="btn {{ variant.class }} btn-lg">Large</button>
    </div>
</div>
{% endfor %}

<div class="mb-6">
    <p class="text-sm text-gray-500 mb-2 font-mono">Special States</p>
    <div class="flex flex-wrap gap-2">
        <button class="btn btn-primary" disabled>Disabled</button>
        <button class="btn btn-primary">
            <span class="loading loading-spinner"></span>
            Loading
        </button>
        <button class="btn btn-outline btn-primary">Outline</button>
        <button class="btn btn-ghost">Ghost</button>
        <button class="btn btn-link">Link</button>
    </div>
</div>
