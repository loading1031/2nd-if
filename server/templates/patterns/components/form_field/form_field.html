<div class="space-y-6 max-w-md">
    <div>
        <p class="text-sm text-gray-500 mb-2 font-mono">Text Input</p>
        <label class="form-control w-full">
            <div class="label">
                <span class="label-text">이메일 주소</span>
            </div>
            <input
                id="email"
                name="email"
                type="email"
                placeholder="example@email.com"
                class="input input-bordered w-full" />
        </label>
    </div>

    <div>
        <p class="text-sm text-gray-500 mb-2 font-mono">Input with Error</p>
        <label class="form-control w-full">
            <div class="label">
                <span class="label-text">이메일 주소</span>
            </div>
            <input
                id="email_error"
                name="email_error"
                type="email"
                value="invalid"
                class="input input-bordered w-full input-error" />
            <div class="label">
                <span class="label-text-alt text-error">올바른 이메일 주소를 입력하세요.</span>
            </div>
        </label>
    </div>

    <div>
        <p class="text-sm text-gray-500 mb-2 font-mono">Password Input</p>
        <label class="form-control w-full">
            <div class="label">
                <span class="label-text">비밀번호</span>
            </div>
            <input
                id="password"
                name="password"
                type="password"
                placeholder="••••••••"
                class="input input-bordered w-full" />
        </label>
    </div>

    <div>
        <p class="text-sm text-gray-500 mb-2 font-mono">Select</p>
        <label class="form-control w-full">
            <div class="label">
                <span class="label-text">카테고리</span>
            </div>
            <select class="select select-bordered w-full">
                <option disabled selected>선택하세요</option>
                <option>Option 1</option>
                <option>Option 2</option>
            </select>
        </label>
    </div>

    <div>
        <p class="text-sm text-gray-500 mb-2 font-mono">Textarea</p>
        <label class="form-control w-full">
            <div class="label">
                <span class="label-text">설명</span>
            </div>
            <textarea class="textarea textarea-bordered w-full" placeholder="내용을 입력하세요..." rows="3"></textarea>
        </label>
    </div>

    <div>
        <p class="text-sm text-gray-500 mb-2 font-mono">Checkbox & Toggle</p>
        <div class="space-y-2">
            <label class="label cursor-pointer justify-start gap-3">
                <input type="checkbox" class="checkbox checkbox-primary" checked />
                <span class="label-text">로그인 상태 유지</span>
            </label>
            <label class="label cursor-pointer justify-start gap-3">
                <input type="checkbox" class="toggle toggle-primary" checked />
                <span class="label-text">알림 받기</span>
            </label>
        </div>
    </div>

    <div>
        <p class="text-sm text-gray-500 mb-2 font-mono">Input Sizes</p>
        <div class="space-y-2">
            <label class="form-control w-full">
                <input
                    id="size_xs"
                    name="size_xs"
                    type="text"
                    placeholder="input-xs"
                    class="input input-bordered w-full input-xs" />
            </label>
            <label class="form-control w-full">
                <input
                    id="size_sm"
                    name="size_sm"
                    type="text"
                    placeholder="input-sm"
                    class="input input-bordered w-full input-sm" />
            </label>
            <label class="form-control w-full">
                <input
                    id="size_md"
                    name="size_md"
                    type="text"
                    placeholder="input-md"
                    class="input input-bordered w-full input-md" />
            </label>
            <label class="form-control w-full">
                <input
                    id="size_lg"
                    name="size_lg"
                    type="text"
                    placeholder="input-lg"
                    class="input input-bordered w-full input-lg" />
            </label>
        </div>
    </div>
</div>
