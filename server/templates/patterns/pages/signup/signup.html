{% extends "patterns/base_page.html" %}

{% block title %}회원가입 - 2nd-if{% endblock %}

{% block nav %}
<nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a href="#" class="text-xl font-bold text-gray-900">2nd-if</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="#" class="text-gray-600 hover:text-gray-900">로그인</a>
                <a href="#" class="btn btn-primary btn-sm">회원가입</a>
            </div>
        </div>
    </div>
</nav>
{% endblock %}

{% block content %}
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center justify-center min-h-[80vh] px-4">
        <div class="card bg-base-100 shadow-xl w-full max-w-md">
            <div class="card-body">
                <h2 class="card-title text-2xl font-bold justify-center mb-4">
                    회원가입
                </h2>

                <div class="alert alert-error" role="alert">
                    <span>입력 정보를 확인해주세요.</span>
                </div>

                <form class="space-y-4">
                    <label class="form-control w-full">
                        <div class="label">
                            <span class="label-text">이메일 주소</span>
                        </div>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="example@email.com"
                            autocomplete="email"
                            required
                            class="input input-bordered w-full input-error" />
                        <div class="label">
                            <span class="label-text-alt text-error">이미 등록된 이메일입니다.</span>
                        </div>
                    </label>

                    <label class="form-control w-full">
                        <div class="label">
                            <span class="label-text">비밀번호</span>
                        </div>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            required
                            class="input input-bordered w-full" />
                    </label>

                    <label class="form-control w-full">
                        <div class="label">
                            <span class="label-text">비밀번호 확인</span>
                        </div>
                        <input
                            id="password_confirm"
                            name="password_confirm"
                            type="password"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            required
                            class="input input-bordered w-full input-error" />
                        <div class="label">
                            <span class="label-text-alt text-error">비밀번호가 일치하지 않습니다.</span>
                        </div>
                    </label>

                    <button type="button" class="btn btn-primary w-full mt-2">
                        회원가입
                    </button>
                </form>

                <div class="divider">OR</div>

                <p class="text-center text-sm">
                    이미 계정이 있으신가요?
                    <a href="#" class="link link-primary">로그인</a>
                </p>
            </div>
        </div>
    </div>
</main>
{% endblock %}
