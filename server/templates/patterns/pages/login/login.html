{% extends "patterns/base_page.html" %}

{% block title %}로그인 - 2nd-if{% endblock %}

{% block nav %}
<nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a href="#" class="text-xl font-bold text-gray-900">2nd-if</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="#" class="text-gray-600 hover:text-gray-900">로그인</a>
                <a href="#" class="btn btn-primary btn-sm">회원가입</a>
            </div>
        </div>
    </div>
</nav>
{% endblock %}

{% block content %}
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center justify-center min-h-[80vh] px-4">
        <div class="card bg-base-100 shadow-xl w-full max-w-md">
            <div class="card-body">
                <h2 class="card-title text-2xl font-bold justify-center mb-4">
                    로그인
                </h2>

                <div class="alert alert-error" role="alert">
                    <span>이메일 또는 비밀번호가 올바르지 않습니다.</span>
                </div>

                <form class="space-y-4">
                    <label class="form-control w-full">
                        <div class="label">
                            <span class="label-text">이메일 주소</span>
                        </div>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="example@email.com"
                            autocomplete="email"
                            required
                            class="input input-bordered w-full" />
                    </label>

                    <label class="form-control w-full">
                        <div class="label">
                            <span class="label-text">비밀번호</span>
                        </div>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                            class="input input-bordered w-full" />
                    </label>

                    <div class="flex items-center justify-between">
                        <label class="label cursor-pointer gap-2">
                            <input type="checkbox" class="checkbox checkbox-sm checkbox-primary" />
                            <span class="label-text">로그인 상태 유지</span>
                        </label>
                        <a href="#" class="link link-primary text-sm">비밀번호를 잊으셨나요?</a>
                    </div>

                    <button type="button" class="btn btn-primary w-full">
                        로그인
                    </button>
                </form>

                <div class="divider">OR</div>

                <p class="text-center text-sm">
                    계정이 없으신가요?
                    <a href="#" class="link link-primary">회원가입</a>
                </p>
            </div>
        </div>
    </div>
</main>
{% endblock %}
