{# 재사용 가능한 알림 컴포넌트 #}
{# 사용법: include "components/alert.html" with alert_type="alert-error" message="에러" #}
{# 필수: message / 선택: alert_type, extra_class #}
{% if message %}
<div class="alert {{ alert_type|default:'' }} {{ extra_class }}" role="alert">
    <span>{{ message }}</span>
</div>
{% endif %}
