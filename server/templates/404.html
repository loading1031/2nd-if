{% extends "base.html" %}
{% block title %}페이지를 찾을 수 없습니다 - 2nd-if{% endblock %}
{% block content %}

        <h1 class="text-9xl font-bold text-primary">404</h1>
        <p class="text-2xl font-semibold text-gray-800 mt-4">페이지를 찾을 수 없습니다</p>
