<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서버 오류 - 2nd-if</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9fafb; }
        .container { text-align: center; padding: 2rem; }
        h1 { font-size: 6rem; font-weight: bold; color: #570df8; }
        .title { font-size: 1.5rem; font-weight: 600; color: #1f2937; margin-top: 1rem; }
        .desc { color: #6b7280; margin-top: 0.5rem; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; background: #570df8; color: white; text-decoration: none; border-radius: 0.5rem; font-weight: 600; }
        .btn:hover { background: #4506cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <p class="title">서버 오류가 발생했습니다</p>
        <p class="desc">잠시 후 다시 시도해주세요. 문제가 계속되면 관리자에게 문의해주세요.</p>
        <a href="/" class="btn">홈으로 돌아가기</a>
    </div>
</body>
</html>
