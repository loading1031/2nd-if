{% load static %}
<article class="max-w-4xl mx-auto">
    <header class="mb-8">
        <h1 class="text-3xl font-bold mb-2">{{ episode.title }}</h1>
        <div class="flex items-center gap-3 text-base-content/60">
            <span>by {{ episode.author.nickname }}</span>
            <span>·</span>
            <span class="badge badge-warning">유료 {{ price }} USDC</span>
        </div>
    </header>

    <div class="card bg-base-200 shadow-lg">
        <div class="card-body items-center text-center py-16">
            <svg class="w-16 h-16 text-base-content/30 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <h2 class="text-xl font-bold mb-2">유료 에피소드입니다</h2>
            <p class="text-base-content/60 mb-6">이 에피소드를 읽으려면 결제가 필요합니다.</p>

            {% if user.is_authenticated %}
            <button class="btn btn-primary" onclick="document.getElementById('payment-modal').showModal()">
                {{ price }} USDC로 결제하기
            </button>

            {% include "stories/partials/payment_modal.html" %}
            {% else %}
            <a href="{% url 'users:login_page' %}?next={{ request.path }}" class="btn btn-primary">
                로그인 후 결제하기
            </a>
            {% endif %}
        </div>
    </div>
</article>

<script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>
<script>window.POLYGON_CONFIG = {{ polygon_config_json|safe }};</script>
<script src="{% static 'js/metamask-payment.js' %}"></script>
