{% extends "base.html" %}

{% block title %}로그인 - {{ block.super }}{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh] px-4">
    <div class="card bg-base-100 shadow-xl w-full max-w-md">
        <div class="card-body">
            <h2 class="card-title text-2xl font-bold justify-center mb-4">
                로그인
            </h2>

            <form class="space-y-4" hx-post="/htmx/auth/login/" hx-trigger="submit" hx-swap="innerHTML" hx-target="#content" hx-indicator="#login-indicator">
                {% csrf_token %}

                <label class="form-control w-full">
                    <div class="label">
                        <span class="label-text">이메일 주소</span>
                    </div>
                    <input id="email" name="email" type="email" autocomplete="email" required
                           placeholder="example@email.com"
                           class="input input-bordered w-full" />
                </label>

                <label class="form-control w-full">
                    <div class="label">
                        <span class="label-text">비밀번호</span>
                    </div>
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                           placeholder="••••••••"
                           class="input input-bordered w-full" />
                </label>

                <div class="flex items-center justify-between">
                    <label class="label cursor-pointer gap-2">
                        <input id="remember-me" name="remember-me" type="checkbox" class="checkbox checkbox-sm checkbox-primary" />
                        <span class="label-text">로그인 상태 유지</span>
                    </label>

                    <a href="#" class="link link-primary text-sm">
                        비밀번호를 잊으셨나요?
                    </a>
                </div>

                <button type="submit" class="btn btn-primary w-full">
                    <span id="login-indicator" class="loading loading-spinner htmx-indicator"></span>
                    로그인
                </button>
            </form>

            <div class="divider">OR</div>

            <p class="text-center text-sm">
                계정이 없으신가요?
                <a href="{% url 'users:signup_page' %}" class="link link-primary">
                    회원가입
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
