{% extends "base.html" %}

{% block title %}이메일 전송 완료 - {{ block.super }}{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh] px-4">
    <div class="card bg-base-100 shadow-xl w-full max-w-md">
        <div class="card-body text-center">
            <div class="text-5xl mb-4">📧</div>
            <h2 class="card-title text-2xl font-bold justify-center mb-4">이메일을 확인하세요</h2>
            <p class="text-gray-600 mb-6">비밀번호 재설정 링크를 이메일로 보냈습니다. 메일함을 확인해주세요.</p>
            <p class="text-sm text-gray-500 mb-4">이메일이 오지 않았다면 스팸 폴더를 확인하거나 다시 시도해주세요.</p>
            <a href="{% url 'users:login_page' %}" class="btn btn-primary w-full">로그인으로 돌아가기</a>
        </div>
    </div>
</div>
{% endblock %}
