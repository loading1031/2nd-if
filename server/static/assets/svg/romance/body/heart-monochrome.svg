<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
  <title id="title">심장 — 흑백 명암 시안</title>
  <desc id="desc">기존 심장 실루엣에 근육 결, 가는 혈관 가지와 혈관의 둥근 명암을 더한 흑백 벡터 시안. 의학 교육용 해부도가 아닌 스타일화한 그림이다.</desc>
  <style>
    #heart { transform-box: fill-box; transform-origin: center; animation: beat 3.6s ease-in-out infinite; }
    @keyframes beat { 0%, 72%, 100% { transform: scale(1); } 78% { transform: scale(1.025); } 84% { transform: scale(1); } 90% { transform: scale(1.014); } }
    @media (prefers-reduced-motion: reduce) { #heart { animation: none; } }
  </style>
  <defs>
    <radialGradient id="muscle" cx=".31" cy=".23" r=".85" color-interpolation="linearRGB"><stop stop-color="#dddddd"/><stop offset=".28" stop-color="#b1b1b1"/><stop offset=".55" stop-color="#7b7b7b"/><stop offset=".8" stop-color="#454545"/><stop offset="1" stop-color="#292929"/></radialGradient>
    <linearGradient id="vessel" x1="0" y1="0" x2="1" y2="1" color-interpolation="linearRGB"><stop stop-color="#eeeeee"/><stop offset=".25" stop-color="#bdbdbd"/><stop offset=".62" stop-color="#7e7e7e"/><stop offset="1" stop-color="#3c3c3c"/></linearGradient>
    <linearGradient id="blue-vessel" x1="0" y1="0" x2="1" y2="1" color-interpolation="linearRGB"><stop stop-color="#c0c0c0"/><stop offset=".3" stop-color="#8a8a8a"/><stop offset=".7" stop-color="#535353"/><stop offset="1" stop-color="#303030"/></linearGradient>
    <filter id="shadow" x="-20%" y="-15%" width="145%" height="150%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/><feOffset in="blur" dx="2" dy="12" result="offset"/>
      <feFlood flood-color="#373737" flood-opacity=".22" result="color"/><feComposite in="color" in2="offset" operator="in" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
