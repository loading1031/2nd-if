app = "2nd-if"
primary_region = "nrt"  # Tokyo - closest to Korea

[build]

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.prod"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    type = "http"
    port = 8000
    path = "/health/"
    interval = "30s"
    timeout = "5s"

[mounts]
  source = "media_data"
  destination = "/app/server/media"
