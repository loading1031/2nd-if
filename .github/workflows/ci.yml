name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          uv run python -m pytest \
            server/apps/users/tests.py \
            server/apps/users/tests_fingerprint.py \
            server/apps/users/tests_password.py \
            server/apps/stories/tests.py \
            server/apps/stories/tests_watermark.py \
            server/apps/stories/tests_upload.py \
            -v --tb=short

      - name: Run linter
        run: uv run ruff check server/

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: 2nd-if:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
