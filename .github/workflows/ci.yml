name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          uv run python -m pytest \
            server/apps/core/tests.py \
            server/apps/users/tests.py \
            server/apps/users/tests_fingerprint.py \
            server/apps/users/tests_password.py \
            server/apps/stories/tests.py \
            server/apps/stories/tests_watermark.py \
            server/apps/stories/tests_upload.py \
            -v --tb=short

      - name: Run linter
        run: uv run ruff check server/
