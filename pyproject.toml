[project]
name = "2nd-if"
version = "0.1.0"
description = "Django Async + HTMX + django-editor-js project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.0",
    "django-editorjs-fields>=0.2.7",
    "django-extensions>=4.1",
    "neomodel>=6.1.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "django-extensions>=3.2.3",
    "django-debug-toolbar>=4.2.0",
]
prod = [
    "psycopg[binary]>=3.1.0",
    "gunicorn>=21.0.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-django>=4.5.0",
    "pytest-asyncio>=0.21.0",
    "django-pattern-library>=1.5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["server"]
asyncio_mode = "auto"
