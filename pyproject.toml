[project]
name = "2nd-if"
version = "0.1.0"
description = "Django Async + HTMX + TipTap 소설 플랫폼"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.0",
    "django-allauth[socialaccount]>=65.15.0",
    "django-extensions>=4.1",
    "nh3>=0.2.0",
    "httpx>=0.28.1",
    "neomodel>=6.1.0",
    "pillow>=10.0.0",
    "prometheus-client>=0.24.1",
]

[project.optional-dependencies]
dev = [
    "django-extensions>=3.2.3",
    "django-debug-toolbar>=4.2.0",
]
prod = [
    "gunicorn>=21.0.0",
    "uvicorn>=0.42.0",
    "whitenoise>=6.12.0",
    "oracledb>=2.0.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-django>=4.5.0",
    "pytest-asyncio>=0.21.0",
    "django-pattern-library>=1.5.0",
    "playwright>=1.58.0",
    "pytest-playwright>=0.7.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["server"]
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end browser tests (Playwright)",
]
# Unit 테스트: python -m pytest server/apps/
# E2E 테스트: python -m pytest server/tests/e2e/ -o "asyncio_mode=strict"
# 전체: 위 두 명령을 순서대로 실행

[tool.ruff]
target-version = "py314"
src = ["server"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "DJ",   # flake8-django
]
ignore = [
    "E501",  # line-length (formatter handles this)
    "F403",  # star imports (Django settings pattern)
    "F405",  # may be undefined from star imports (Django settings pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"
